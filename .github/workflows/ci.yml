name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dsh-plugin-evaluation/dsh-plugin-evaluation-standards
          ref: v1.1.0
          path: fixtures/dsh-plugin-evaluation-standards
      - uses: actions/checkout@v4
        with:
          repository: dsh-plugin-evaluation/dsh-security-evaluation-dataset
          ref: v1.1.0
          path: fixtures/dsh-security-evaluation-dataset
      - run: |
          mkdir -p "$HOME/Desktop/dsh-project"
          ln -s "$GITHUB_WORKSPACE/fixtures/dsh-plugin-evaluation-standards" "$HOME/Desktop/dsh-project/dsh-plugin-evaluation-standards"
          ln -s "$GITHUB_WORKSPACE/fixtures/dsh-security-evaluation-dataset" "$HOME/Desktop/dsh-project/dsh-security-evaluation-dataset"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm run verify
