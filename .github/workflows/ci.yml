name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dsh-plugin-evaluation/dsh-plugin-evaluation-standards
          ref: v1.1.0
          path: ../dsh-plugin-evaluation-standards
      - uses: actions/checkout@v4
        with:
          repository: dsh-plugin-evaluation/dsh-security-evaluation-dataset
          ref: v1.1.0
          path: ../dsh-security-evaluation-dataset
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm run verify
